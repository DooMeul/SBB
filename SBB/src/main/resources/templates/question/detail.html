<!DOCTYPE html>
<!-- ==========================================================================
     [파일 역할] question/detail.html = 질문(게시글) "상세" 화면 + 답변(댓글) 목록 + 답변 작성 폼
      - 연결 URL    : GET /question/{id} → QuestionController.detail()
                      (답변 등록 검증 실패 시 AnswerController.createAnswer() 에서도 이 화면을 다시 보여줌)
      - 받는 데이터 : ${question}  (Question 엔티티. question.subject / content / answerList 사용)
                      ${answerDto} (답변 폼용 빈 객체. 컨트롤러 매개변수 AnswerDto answerDto 로 자동 전달)
      - 답변 등록   : POST /answer/create/{질문id} → AnswerController.createAnswer() → 저장 후 다시 이 화면으로 redirect

      [구성]  ① 질문 제목 카드  ② 질문 내용 카드  ③ 답변 목록 카드  ④ 답변 작성 폼 카드
     ========================================================================== -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<!-- [이 페이지 전용 CSS] → layout.html 의 <head> 안 css 자리에 들어감 -->
<th:block layout:fragment="css">
    <style>
        .fieldError{            /* 답변 검증 에러 메시지를 빨간 글씨로 */
            color: #b02a37;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">
    <!-- ================= ① 질문 제목 카드 ================= -->
    <!-- 질문 제목 Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">질문</h4>
        </div>
        <div class="card-body">
            <!-- th:text : 태그 안 글자("제목")를 ${question.subject} 값으로 바꿔서 출력 -->
            <h2 class="card-title fw-bold"
                th:text="${question.subject}">
                제목
            </h2>
        </div>
    </div>

    <!-- ================= ② 질문 내용 카드 ================= -->
    <!-- 질문 내용 Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">질문 내용</h5>
        </div>
        <div class="card-body">
            <!-- white-space: pre-wrap : 입력할 때 넣은 줄바꿈(엔터)을 화면에서도 그대로 보여줌 -->
            <p class="card-text"
               style="white-space: pre-wrap;"
               th:text="${question.content}">
                내용
            </p>
        </div>
    </div>

    <!-- ================= ③ 답변 목록 카드 ================= -->
    <!-- 답변 목록 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">
                답변 목록
                <!-- #lists.size(리스트) : 답변 개수를 배지로 표시 -->
                <span class="badge bg-primary"
                      th:text="${#lists.size(question.answerList)}">0</span>
            </h5>
        </div>

        <div class="card-body">

            <!-- 답변이 없는 경우 -->
            <!-- #lists.isEmpty : 답변 목록이 비어 있을 때만 이 div 를 보여줌 -->
            <div th:if="${#lists.isEmpty(question.answerList)}"
                 class="text-center text-muted py-4">
                아직 등록된 답변이 없습니다.
            </div>

            <!-- 답변마다 개별 Card 생성 -->
            <!-- th:each : answerList 의 답변을 하나씩 answer 변수에 담아 카드 반복 생성
                 stat : 반복 상태 (stat.count = 1, 2, 3 ...) -->
            <div th:each="answer, stat : ${question.answerList}"
                 class="card mb-3 shadow-sm">

                <div class="card-header bg-white d-flex align-items-center">
                <!-- |답변 ${stat.count}| → "답변 1", "답변 2" ... -->
                <span class="badge bg-secondary me-2"
                      th:text="|답변 ${stat.count}|">
                    답변 1
                </span>
                    <span class="text-muted small">답변 내용</span>
                </div>

                <div class="card-body">
                    <!-- 답변 내용 출력 (줄바꿈 유지) -->
                    <p class="card-text mb-0"
                       style="white-space: pre-wrap;"
                       th:text="${answer.content}">
                        답변 내용
                    </p>
                </div>

            </div>

        </div>
    </div>

    <!-- ================= ④ 답변 작성 폼 카드 ================= -->
    <!-- 답변 작성 Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">답변 작성</h5>
        </div>

        <div class="card-body">
            <!-- th:action : POST /answer/create/{질문id} 로 전송 (|...| 로 질문 id 를 주소에 붙임) → AnswerController.createAnswer()
                 th:object="${answerDto}" : 답변 폼 객체 (QuestionController.detail 의 AnswerDto 매개변수가 넘겨준 것) -->
            <form th:action="@{|/answer/create/${question.id}|}"
                  th:object="${answerDto}"
                  method="post">

                <div class="mb-3">
                    <label for="content" class="form-label fw-semibold">
                        답변 내용
                    </label>

                    <!-- th:field="*{content}" → answerDto.content 와 연결 (name="content" 로 전송됨) -->
                    <textarea id="content"
                              name="content"
                              class="form-control"
                              rows="8"
                              placeholder="질문에 대한 답변을 입력하세요."
                              th:field="*{content}"
                              ></textarea>
                    <!-- 답변 내용이 비었을 때 AnswerDto 의 "내용은 필수 항목입니다." 메시지 출력 -->
                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError">error</p>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        답변 등록
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
