<!DOCTYPE html>
<!-- ==========================================================================
     [파일 역할] static/index_.html = 정적(static) HTML 연습 파일
      - static 폴더의 파일은 컨트롤러 없이 주소로 바로 접근 가능 → http://localhost:8080/index_.html
      - Thymeleaf 문법(th:)은 static 폴더에서는 동작하지 않음 (그냥 순수 HTML)
      ※ 파일 이름이 index.html 이었다면 "/" 접속 시 이 파일이 보였겠지만,
        이름을 index_.html 로 바꿔서 지금은 "/" 요청을 IndexController 가 처리함
     ========================================================================== -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>스프링 부트</h1>
</body>
</html>
